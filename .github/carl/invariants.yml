    rule: "Adding a second context via OAuth must not overwrite the primary session"
    severity: high

  - id: aadlc-chart-output-must-never-contain-nan-or-infinity-ne
    name: "Chart output must never contain `NaN` or `Infinity`; negatives are"
    rule: "Chart output must never contain `NaN` or `Infinity`; negatives are"
