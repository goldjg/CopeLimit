schemaVersion: aadlc.plan.v0.2
planId: horizon-1-pr2-billing-phase
project: CopeLimit
status: active

run:
  type: implementation
  horizon: 1
  title: Horizon 1 PR 2 — BillingPhase state model
  intent: >-
    Add a BillingPhase type and detectBillingPhase() function to copilot.ts.
    Extend the Usage type with billingPhase, overageCount, and overageEntitlement
    optional fields. Update normaliseUsage to accept and pass these fields through.
    Update github-copilot-internal provider to populate them from the observed
    overage_* API fields. Add tests. Do not change the wire shape of existing
    fields or break any existing caller.
  modelRecommendation:
    planner: sonnet
    executor: gpt-5.4
    avoid:
      - gpt-5.3-codex

# Design contract: the BillingPhase model is fully specified in ARCHITECTURE.md
# § "Billing state model". Read that section before implementation.
# Detection priority (first match wins):
#   1. unlimited        — unlimited === true
#   2. credits_available — remaining > 0
#   3. budget_active    — overage_count > 0 && overage_permitted === true
#   4. budget_available — remaining === 0 && overage_permitted === true && overage_count === 0
#   5. hard_stop        — has_quota === false && unlimited !== true
#   6. credits_exhausted — remaining === 0 && overage_permitted !== true

scope:
  allowedFiles:
    - .github/aadlc/plans/horizon-1-pr2-billing-phase.plan.yml
    - netlify/functions/lib/copilot.ts
    - netlify/functions/lib/__tests__/copilot.test.ts
    - netlify/functions/usage.ts
    - netlify/functions/widget-usage.ts
  forbiddenFiles:
    - .github/aadlc/memory.md
    - .github/aadlc/current-pr-contract.md
    - .github/aadlc/tool-policy.yml
    - .github/aadlc/invariants.yml
    - .github/instructions/**
    - ARCHITECTURE.md
    - src/**
    - public/**
    - netlify/functions/lib/session.ts
    - netlify/functions/lib/widget-store.ts
    - netlify/functions/lib/onboarding-store.ts
    - netlify/functions/lib/capture-store.ts
    - netlify/functions/lib/capture-sanitize.ts
    - netlify/functions/lib/blob-store.ts
    - netlify/functions/lib/blob-crypto.ts
    - package.json
    - package-lock.json
    - tsconfig.json
    - netlify.toml
    - .github/workflows/**
  allowedChangeTypes:
    - type-definitions
    - field-additions-non-breaking
    - provider-normalisation
    - tests
    - governance
  forbiddenChangeTypes:
    - auth
    - oauth
    - token-storage
    - ui
    - widget
    - blob-storage-format
    - dependency-addition
    - ci-workflow
    - removal-of-existing-fields
    - breaking-wire-shape-changes

toolPermissions:
  readFiles: allowed
  searchRepo: allowed
  editFiles: allowed_within_scope
  runTests: allowed_if_deps_available
  runBuild: allowed_if_deps_available
  runLint: optional
  createBranch: forbidden
  commitChanges: requires_explicit_user_approval
  createPullRequest: requires_explicit_user_approval
  callCodeReview: optional
  deploy: forbidden
  deleteFiles: forbidden
  bulkReplaceAcrossFiles: forbidden

mutationPermissions:
  mayCreateFiles: false
  mayEditFiles: true
  mayDeleteFiles: false
  mayRenameFiles: false
  mayMoveFiles: false
  mayEditOutsideScope: false

approvalGates:
  requireUserApprovalBefore:
    - widening_scope
    - touching_forbidden_files
    - adding_dependencies
    - changing_auth_or_token_storage
    - creating_pull_request
    - committing_changes

# Contract assertions (must be validated by tests):
# 1. detectBillingPhase returns 'unlimited' when unlimited === true,
#    regardless of remaining or overage fields.
# 2. detectBillingPhase returns 'credits_available' when remaining > 0
#    and unlimited !== true.
# 3. detectBillingPhase returns 'budget_active' when overage_count > 0
#    and overage_permitted === true and remaining === 0.
# 4. detectBillingPhase returns 'budget_available' when remaining === 0
#    and overage_permitted === true and overage_count === 0.
# 5. detectBillingPhase returns 'hard_stop' when has_quota === false
#    and unlimited !== true.
# 6. Usage type extension is backward-compatible: billingPhase, overageCount,
#    overageEntitlement are all optional. Callers that don't pass them receive
#    billingPhase derived from the included-credits fields only.

validation:
  required:
    - npm test
    - npm run build
    - changed_files_within_scope
    - no_forbidden_change_types
    - no_breaking_wire_shape_changes
    - final_plan_compliance_summary
    - all_contract_assertions_covered_by_tests
  knownNonBlocking:
    - npm run lint may fail with TS5107 from deprecated moduleResolution Node in tsconfig.json

aadlc:
  expectedPhaseTypes:
    - hydration
    - planning
    - implementation
    - test_debug
    - validation
  emitRunManifest: false
  manifestMode: final_response_only
  phaseEventsRequired: false

nonGoals:
  - ui-changes
  - widget-script-changes
  - multi-context-horizon-2
  - finops-horizon-3
  - overage_entitlement-dollar-conversion
  - budget-enforcement
  - runtime-validation-library
  - dependency-changes
  - commits
  - pull-requests

openQuestions:
  - Is overage_entitlement expressed as a raw credit integer, a
    dollar-equivalent, or a different unit? Confirm from live capture
    before wiring the display value. If unit is unclear, store as-is
    and annotate with a TODO.
  - Does the mock provider need updated defaults (MOCK_QUOTA=7000)?
    Treat as a separate follow-up; do not block this PR on it.
  - Does copilot-local proxy expose equivalent overage fields?
    If not, default billingPhase to credits_available for that provider.
