# Contract assertions (must be validated by tests):
# 1. detectBillingPhase returns 'unlimited' when unlimited === true,
#    regardless of remaining or overage fields.
# 2. detectBillingPhase returns 'credits_available' when rawRemaining > 0
#    and unlimited !== true.
# 3. detectBillingPhase returns 'budget_active' when overageCount > 0
#    and overagePermitted === true and rawRemaining === 0.
# 4. detectBillingPhase returns 'budget_active' when rawRemaining < 0
#    and overagePermitted === true and overageCount === 0.
#    (settlement-lag case — CRITICAL: this is the new assertion from capture 2)
# 5. detectBillingPhase returns 'budget_available' when rawRemaining === 0
#    and overagePermitted === true and overageCount === 0.
# 6. detectBillingPhase returns 'hard_stop' when hasQuota === false
#    and unlimited !== true.
# 7. Usage type extension is backward-compatible: billingPhase, overageCount,
#    overageEntitlement, derivedOverageCredits are all optional. Callers that
#    don't pass them receive billingPhase derived from rawRemaining/remaining fields.
# 8. When rawRemaining < 0, derivedOverageCredits === Math.max(0, -rawRemaining).
#    For rawRemaining = -473: derivedOverageCredits = 473.
# 9. The provider code in usage.ts must NOT clamp remaining before computing used
#    when rawRemaining < 0. safeRemaining clamping must not destroy the rawRemaining
#    signal needed by detectBillingPhase.

validation:
  required:
    - npm test
    - npm run build
    - changed_files_within_scope
    - no_forbidden_change_types
    - no_breaking_wire_shape_changes
    - final_plan_compliance_summary
    - all_contract_assertions_covered_by_tests
  knownNonBlocking:
    - npm run lint may fail with TS5107 from deprecated moduleResolution Node in tsconfig.json

aadlc:
  expectedPhaseTypes:
    - hydration
    - planning
    - implementation
    - test_debug
    - validation
  emitRunManifest: false
  manifestMode: final_response_only
  phaseEventsRequired: false

nonGoals:
  - ui-changes
  - widget-script-changes
  - multi-context-horizon-2
  - finops-horizon-3
  - overage_entitlement-dollar-conversion
  - budget-enforcement
  - runtime-validation-library
  - dependency-changes
  - commits
  - pull-requests

openQuestions:
  - Is overage_entitlement expressed as a raw credit integer, a
    dollar-equivalent, or a different unit? Confirm from live capture
    where overage_count > 0 before wiring the display value. If unit is
    unclear, store as-is and annotate with a TODO.
  - What is the magnitude of the settlement lag between rawRemaining going
    negative and overage_count incrementing? Hours? Days? Billing cycle?
    This affects whether derivedOverageCredits needs a staleness caveat.
  - Does the mock provider need updated defaults (MOCK_QUOTA=7000)?
    Treat as a separate follow-up; do not block this PR on it.
  - Does copilot-local proxy expose equivalent overage fields?
    If not, default billingPhase to credits_available for that provider.
