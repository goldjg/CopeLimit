schemaVersion: aadlc.plan.v0.2
planId: horizon-1-pr2-billing-phase
project: CopeLimit
status: active

run:
  type: implementation
  horizon: 1
  title: Horizon 1 PR 2 — BillingPhase amendment (rawRemaining fix)
  intent: >-
    BillingPhase, detectBillingPhase(), readOverageFields(), and the Usage
    billingPhase/overageCount/overageEntitlement fields are already implemented
    in copilot.ts (shipped in PR #34). This plan governs the required amendment
    to that implementation.

    AMENDMENT: detectBillingPhase must receive rawRemaining (the pre-clamp
    API value) as a distinct parameter. Detection priority 3 (budget_active)
    must fire when (overageCount > 0 || rawRemaining < 0) && overagePermitted
    === true, not only when overageCount > 0. This corrects the settlement-lag
    detection gap observed in capture 2 (remaining: -473, overage_count: 0,
    billing: $0). Also add derivedOverageCredits optional field to Usage type
    and wire it from the provider.

    Add tests for all contract assertions including the rawRemaining < 0 case.
    Do not change the wire shape of existing fields or break any existing caller.
  modelRecommendation:
    planner: sonnet
    executor: gpt-5.4
    avoid:
      - gpt-5.3-codex

# Design contract: the BillingPhase model is fully specified in ARCHITECTURE.md
# § "Billing state model". Read the full section including "Negative remaining:
# detection gap and proposed fix" before implementation.
#
# AMENDED Detection priority (first match wins, uses rawRemaining):
#   1. unlimited        — unlimited === true
#   2. credits_available — rawRemaining > 0
#   3. budget_active    — (overage_count > 0 || rawRemaining < 0) && overage_permitted === true
#   4. budget_available — rawRemaining === 0 && overage_permitted === true && overage_count === 0
#   5. hard_stop        — has_quota === false && unlimited !== true
#   6. credits_exhausted — rawRemaining <= 0 && overage_permitted !== true (default)
#
# Key change from original: priority 3 now includes rawRemaining < 0 as an
# additional trigger. The detectBillingPhase signature must include rawRemaining.

